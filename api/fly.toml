app            = "cindy-dent-api"
primary_region = "mia"

[build]
  dockerfile = "api/Dockerfile"

[env]
  MODEL_PATH = "/app/models/best_caries_v3.pt"
  PORT       = "5000"

[http_service]
  internal_port       = 5000
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size   = "shared-cpu-1x"
  memory = "1gb"
