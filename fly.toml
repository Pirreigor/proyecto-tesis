app            = "cindy-dent"
primary_region = "dfw"

[build]

[env]
  NODE_ENV      = "production"
  FLASK_PORT    = "5000"
  FLASK_API_URL = "http://localhost:5000"

[http_service]
  internal_port       = 3001
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size   = "shared-cpu-1x"
  memory = "1gb"
